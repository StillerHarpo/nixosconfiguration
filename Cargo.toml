[package]
name = "openorraise"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openorraise"
path = "rust/openorraise/src/main.rs"

[[bin]]
name = "mediamenu"
path = "rust/mediamenu/src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
swayipc = "3.0"
serde_json = "1.0"
crossterm = "0.29.0"
ratatui = "0.29"
crokey = "1.2.0"
color-eyre = "0.6.3"
strum = "0.27"
strum_macros = "0.27"
tokio = { version = "1", features = ["full"]}
mediathekviewtui = { git = "https://codeberg.org/fengel/mediathekviewtui.git" }