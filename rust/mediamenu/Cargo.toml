[package]
name = "mediamenu"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mediamenu"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.29"
crokey = "1.2.0"
color-eyre = "0.6.3"
strum = "0.27"
strum_macros = "0.27"
tokio = { version = "1", features = ["full"]}
mediathekviewtui = { git = "https://codeberg.org/fengel/mediathekviewtui.git" }
jellytui = { git = "https://github.com/StillerHarpo/jellytui" }
battery = "0.7.8"
chrono = "0.4.41"
gilrs = "0.11.0"
directories = "5.0"
regex = "1.12.3"
simple-regex = "1.0.1"
env_logger = "0.11.9"
log = "0.4.29"
sdl2 = "0.38.0"

[features]
real = []
